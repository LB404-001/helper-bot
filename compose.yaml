services:
  bot:
    build: .
    depends_on:
      db: 
        condition: service_healthy
      redis:
        condition: service_started
      worker: 
        condition: service_healthy
    
    environment:
      CELERY_BROKER_URL: "redis://redis:6379/0"
      COMFY_URL: "host.docker.internal:8188"
      BOT_SETTINGS: "telegram_bot/container_settings.json"

    ports:
      - "40.0.0.2:8080:8080"

    networks:
      - helper

  worker:
    build: .
    command: celery -A agent.comfy.worker worker -Q comfy --loglevel=INFO -n worker1@%h
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    environment:
      CELERY_BROKER_URL: "redis://redis:6379/0"
      COMFY_URL: "host.docker.internal:8188"

    depends_on: [redis]
    stop_grace_period: 120s

    networks:
      - helper

    healthcheck:
      test: ["CMD-SHELL", "celery -A agent.comfy.worker inspect ping --timeout 5 -d worker1@$$HOSTNAME"]
      interval: 10s
      timeout: 10s
      retries: 3

  db:
    image: postgres:17
    ports: 
      - "5555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/sql:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: helper
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    
    networks:
      - helper

  redis:
    image: redis:7
    ports: 
      - "6666:6379"
    networks:
      - helper

networks:
  helper:

volumes:
  postgres_data: