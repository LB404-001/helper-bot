services:
  bot:
    build: .
    depends_on:
      db: 
        condition: service_healthy
      redis:
        condition: service_started
    
    ports:
      - "40.0.0.2:8080:8080"

    networks:
      - helper

  db:
    image: postgres:17
    ports: 
      - "5555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/sql:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: helper
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    
    networks:
      - helper

  redis:
    image: redis:7
    ports: 
      - "6666:6379"
    networks:
      - helper
networks:
  helper:

volumes:
  postgres_data: